name: Diagnosi download (una tantum)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova gli indirizzi
        continue-on-error: true
        run: |
          mkdir -p data
          o=data/diagnosi.txt; : > $o
          echo "IP uscita: $(curl -sS -m 15 https://api.ipify.org)" >> $o
          for u in \
            https://www.google.com \
            https://www.mimit.gov.it/ \
            https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv \
            https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivo.csv \
            http://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv \
            https://mimit.gov.it/images/exportCSV/prezzo_alle_8.csv \
            https://www.mise.gov.it/images/exportCSV/prezzo_alle_8.csv \
            https://carburanti.mise.gov.it/ospzApi/search/zone \
            https://dati.gov.it/ ; do
            r=$(curl -sS -m 20 -o /tmp/x -w "%{http_code} %{size_download}B %{time_total}s" -A "Mozilla/5.0" "$u" 2>&1 | tail -1)
            echo "$u -> $r" >> $o
          done
      - name: Salva
        run: |
          git config user.name "pompa-giusta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/diagnosi.txt
          git commit -m "Esito diagnosi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 3; done
