name: Cerca un distributore (prova una tantum)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cerca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cerca EWA a Santa Marinella
        run: |
          python - <<'PY'
          import sys, re
          sys.path.insert(0, 'scripts')
          import build_data as b
          a_urls, p_urls = b.discover_urls()
          a = b.fetch_first(a_urls, 'anagrafica')
          p = b.fetch_first(p_urls, 'prezzi')
          ids, out = set(), []
          for line in a.splitlines():
              l = line.lower()
              if ('ewa' in l and 'marinella' in l) or ('marinella' in l and 'aurelia' in l):
                  out.append('ANAGRAFICA: ' + line)
                  ids.add(line.split('|')[0].strip())
          for line in p.splitlines():
              if line.split('|')[0].strip() in ids:
                  out.append('PREZZO: ' + line)
          out.insert(0, 'prima riga anagrafica: ' + a.splitlines()[0] + ' || ' + a.splitlines()[1][:80])
          open('data/ricerca.txt', 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print(len(out))
          PY
      - name: Salva il risultato
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/ricerca.txt
          git commit -m "Risultato della ricerca" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 3; done
