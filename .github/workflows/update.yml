name: Aggiorna prezzi e pubblica

on:
  schedule:
    # alle 12:00 ora italiana tutto l'anno: GitHub conosce solo l'ora UTC, quindi si pianificano
    # le 10:00 (ora legale) e le 11:00 (ora solare) e il passaggio "ora" lascia andare solo quella giusta
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ora:
    runs-on: ubuntu-latest
    outputs:
      vai: ${{ steps.c.outputs.vai }}
    steps:
      - id: c
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Rome date +%H)" = "12" ]; then echo "vai=si" >> "$GITHUB_OUTPUT"; else echo "vai=no" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: ora
    if: needs.ora.outputs.vai == 'si'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica i prezzi del Ministero e prepara i dati
        run: python scripts/build_data.py

      - name: Salva lo storico delle medie
        run: |
          git config user.name "pompa-giusta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/anomalie.json data/diagnostica.json
          git diff --cached --quiet || (git commit -m "Aggiorna storico delle medie" && for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done)

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp index.html app.js lib.js style.css province.json manifest.webmanifest icon.svg _site/
          cp -r icons _site/icons
          cp data/pompe.json data/meta.json data/history.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
