name: Aggiorna i servizi dei distributori

on:
  schedule:
    - cron: '30 3 * * 0'   # ogni domenica notte
  workflow_dispatch:

permissions:
  contents: write

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Raccogli i servizi da OpenStreetMap
        run: python scripts/build_services.py

      - name: Salva i servizi
        run: |
          git config user.name "pompa-giusta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/services.json
          git diff --cached --quiet || (git commit -m "Aggiorna i servizi dei distributori" && git push)
