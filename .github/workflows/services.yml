name: Aggiorna i servizi dei distributori

on:
  schedule:
    - cron: '30 3 * * 0'   # ogni domenica notte: aggiorna tutto
    - cron: '40 */4 * * *' # ogni 4 ore: riprova solo le regioni ancora mancanti
  workflow_dispatch:
    inputs:
      regioni:
        description: "Regioni da aggiornare (separate da virgola), oppure 'mancanti', oppure 'tutte'"
        default: 'mancanti'

permissions:
  contents: write

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Raccogli i servizi da OpenStreetMap
        env:
          SOLO: ${{ (github.event_name == 'workflow_dispatch' && inputs.regioni != 'tutte' && inputs.regioni) || (github.event_name == 'schedule' && github.event.schedule != '30 3 * * 0' && 'mancanti') || '' }}
        run: python scripts/build_services.py --solo "$SOLO"

      - name: Salva i servizi
        run: |
          git config user.name "pompa-giusta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/services.json
          git diff --cached --quiet || (git commit -m "Aggiorna i servizi dei distributori" && for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done)
